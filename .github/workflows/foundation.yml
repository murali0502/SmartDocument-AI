name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python and locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Install Tesseract and English language data
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-eng
      - name: Check backend, migrations, and ingestion
        working-directory: backend
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check
          uv run --frozen pytest
      - name: Export the API schema
        run: uv run --project backend --frozen python scripts/export_openapi.py
      - name: Install, verify contracts, and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run contracts
          git diff --exit-code -- src/generated/api.ts
          npm run build
      - name: Verify browser, API, and database integration
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Verify hosted container starts with its persistent volume
        run: |
          docker build -t smartdoc-hosted .
          password=$(openssl rand -hex 24)
          docker volume create smartdoc-hosted-data
          trap 'docker logs smartdoc-hosted; docker rm -f smartdoc-hosted; docker volume rm smartdoc-hosted-data' EXIT
          docker run -d --name smartdoc-hosted -p 127.0.0.1:18082:8000 \
            -v smartdoc-hosted-data:/data -e RAILWAY_ENVIRONMENT_ID=container-check \
            -e SMARTDOC_HOSTED_PASSWORD="$password" smartdoc-hosted
          origin=http://127.0.0.1:18082
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 \
            "$origin/api/v1/health/ready" > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$origin/")" = 401
          curl --fail --silent --user "smartdoc:$password" "$origin/api/v1/docs" | grep -q '/swagger/swagger-ui-bundle.js'
