services:
  - type: web
    name: smartdoc-api
    runtime: docker
    plan: starter
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health/ready
    disk:
      name: smartdoc-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SMARTDOC_HOSTED_PASSWORD
        sync: false
      - key: SMARTDOC_FRONTEND_ORIGIN
        sync: false
