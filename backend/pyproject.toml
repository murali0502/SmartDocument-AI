[project]
name = "smartdoc-ai"
version = "0.1.0"
description = "Evidence-grounded document intelligence"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdoc"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "smartdoc/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
